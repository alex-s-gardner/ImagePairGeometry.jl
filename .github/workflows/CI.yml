name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
          - 'pre'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
        include:
          # macOS runners are Apple silicon; x64 Julia is not available there.
          - version: '1'
            os: macOS-latest
            arch: aarch64
        exclude:
          - os: macOS-latest
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # FastGeoProjections' registered version predates the point-operator API this package is
      # built on. Taken from `main` until a release carrying it is registered. Remove this step and
      # let the `[compat]` bound resolve normally once that release exists.
      #
      # The package environment only: `test/Project.toml` names FastGeoProjections too, and Julia
      # 1.10's `Pkg.test` fails with `can not merge projects` when a git-sourced package appears in
      # both. Adding it here alone leaves one source for the merged environment to take.
      - name: Use FastGeoProjections from main
        shell: julia --color=yes {0}
        run: |
          import Pkg
          Pkg.activate(".")
          Pkg.add(url = "https://github.com/alex-s-gardner/FastGeoProjections.jl", rev = "main")
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  extension:
    name: SARDatasets extension - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['lts', '1']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: alex-s-gardner/FastGeoProjections.jl
          ref: main
          path: deps/FastGeoProjections.jl
      - uses: actions/checkout@v6
        with:
          repository: alex-s-gardner/SARDatasets.jl
          ref: main
          path: deps/SARDatasets.jl
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      # `ImagePairGeometrySARDatasetsExt` needs SARDatasets, which is unregistered, and this package
      # needs FastGeoProjections from `main`. That forces three things:
      #
      # `Pkg.develop` by path rather than `Pkg.add` by URL, because `Pkg.add` promotes a weak dependency
      # into `[deps]` and deletes the `[weakdeps]` entry, which stops the extension loading at all — the
      # tests then pass while testing nothing.
      #
      # The test environment rather than the package environment, since developing into the package
      # environment rewrites `Project.toml` for the same reason.
      #
      # `include("test/runtests.jl")` rather than `Pkg.test`, because Julia 1.10 fails with
      # `can not merge projects` when the environment it merges holds a path-sourced package the package
      # environment also names.
      - name: Run the suite with SARDatasets
        shell: julia --color=yes {0}
        run: |
          import Pkg
          Pkg.activate("test")
          Pkg.develop([Pkg.PackageSpec(path = "deps/FastGeoProjections.jl"),
                       Pkg.PackageSpec(path = "deps/SARDatasets.jl"),
                       Pkg.PackageSpec(path = ".")])
          Pkg.instantiate()
          include(joinpath(pwd(), "test", "runtests.jl"))
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      # As in the test job. The package environment only: `docs/Project.toml` names
      # ImagePairGeometry itself, which is unregistered, so activating `docs` before
      # `julia-buildpkg` has `dev`'d the local copy into it fails to resolve.
      - name: Use FastGeoProjections from main
        shell: julia --color=yes {0}
        run: |
          import Pkg
          Pkg.activate(".")
          Pkg.add(url = "https://github.com/alex-s-gardner/FastGeoProjections.jl", rev = "main")
      - uses: julia-actions/julia-buildpkg@v1
      # `docs/Project.toml` names this package *and* FastGeoProjections, and neither can be resolved
      # from a registry: this one is unregistered, and FastGeoProjections' registered versions predate
      # the `[compat]` bound. So both enter the manifest in one `Pkg.add`, which is one resolve. Two
      # calls fail whichever way they are ordered — each trips on the other's unsatisfiable entry
      # before it has been supplied.
      - name: Use FastGeoProjections from main in docs
        shell: julia --project=docs --color=yes {0}
        run: |
          import Pkg
          Pkg.add([Pkg.PackageSpec(path = pwd()),
                   Pkg.PackageSpec(url = "https://github.com/alex-s-gardner/FastGeoProjections.jl",
                                   rev = "main")])
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using ImagePairGeometry
          DocMeta.setdocmeta!(ImagePairGeometry, :DocTestSetup, :(using ImagePairGeometry); recursive=true)
          doctest(ImagePairGeometry)
