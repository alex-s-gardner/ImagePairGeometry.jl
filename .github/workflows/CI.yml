name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
          - 'pre'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
        include:
          # macOS runners are Apple silicon; x64 Julia is not available there.
          - version: '1'
            os: macOS-latest
            arch: aarch64
        exclude:
          - os: macOS-latest
            arch: x64
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      # AutoRIFT is unregistered, so the test environment cannot name it in `[deps]` — Pkg demands a
      # registered package there. Adding it by URL is what lets the handoff tests run rather than be
      # skipped; without it the extension is never loaded and `test/runtests.jl` skips that testset.
      #
      # Skipped on 1.10, where `Pkg.test` cannot sandbox it. A URL-added package is a *fixed* manifest
      # entry, and 1.10's sandbox copies each fixed entry's whole dependency subgraph into the merged
      # manifest, erroring with "can not merge projects" if any of it is already there. AutoRIFT's
      # closure includes Dates, LinearAlgebra, PrecompileTools and Random, all of which are, so the
      # collision is unavoidable from the test environment. Julia 1.11 removed that check, and its
      # `[sources]` — the registration-free way to name the dependency instead — is also 1.11+. So the
      # extension is exercised on 1.11 and later, and the 1.10 job tests the core package only.
      #
      # `realdata-test` rather than `main`: the extension passes `chip_size_min_x`/`chip_size_max_x`
      # to `AutoRIFT.pointset`, which exists on that branch and not yet on main. Move this to `main`
      # once the branch merges there.
      - name: Add unregistered test dependencies
        if: matrix.version != '1.10'
        run: |
          julia --project=test -e '
            import Pkg
            Pkg.add(url = "https://github.com/alex-s-gardner/AutoRIFT.jl", rev = "realdata-test")'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using ImagePairGeometry
          DocMeta.setdocmeta!(ImagePairGeometry, :DocTestSetup, :(using ImagePairGeometry); recursive=true)
          doctest(ImagePairGeometry)
